name: Reusable workflow lockfile experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  positive-control:
    runs-on: ubuntu-latest
    steps:
      - id: control
        uses: tamird/bpf-linker/.github/actions/lock-control@codex/reusable-lock-callee
      - env:
          MARKER: ${{ steps.control.outputs.marker }}
        run: echo "COMPOSITE_OUTPUT=$MARKER"

  reusable:
    uses: tamird/bpf-linker/.github/workflows/lock-probe.yml@codex/reusable-lock-callee
